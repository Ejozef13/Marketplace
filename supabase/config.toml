# Local development only. Hosted settings must be configured separately.
project_id = "patriot-marketplace"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

# Local captured email only; allow repeated integration runs without real delivery.
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your Patriot Marketplace sign-in code"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.confirmation]
subject = "Verify your Patriot Marketplace email"
content_path = "./supabase/templates/confirmation.html"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created"

# This inbox captures local mail; no real GMU email is sent.
[local_smtp]
enabled = true
port = 54324

# Enable these in later, separately tested feature increments.
[realtime]
enabled = false
[storage]
enabled = false
[studio]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
