name: Project checks
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Keep local stack credentials out of the build log.
      - run: npm run db:start > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - run: npm run db:test
      - run: npm run test:data
      - run: npm run db:types
      - run: git diff --exit-code -- src/lib/supabase/database.types.ts
      - if: always()
        run: npm run db:stop
